name: Generate Daily Grammar Exercise

on:
  schedule:
    # 5 AM IST = 11:30 PM UTC (previous day)
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Replace an existing exercise for today'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency: daily-grammar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json

      - name: Generate and upload personalised exercise
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
          # Without this secret the agent falls back to the template bank.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional repo variables (comma-separated model ids) to swap free models without code changes.
          GRAMMAR_MODELS: ${{ vars.GRAMMAR_MODELS }}
          GRAMMAR_VERIFY_MODELS: ${{ vars.GRAMMAR_VERIFY_MODELS }}
        run: |
          python3 scripts/grammar_agent.py --upload --count 20 ${{ inputs.force && '--force' || '' }}
